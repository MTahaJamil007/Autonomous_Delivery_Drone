[pytest]
# Default run is the bench suite: no simulator, no autopilot, no network.
# `sitl` and `hitl` tests are opt-in because they need a running PX4 and would
# otherwise turn `make check` into a flight test.
addopts = -m "not sitl and not hitl" -ra --strict-markers
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    sitl: requires a running PX4 SITL instance and Gazebo world
    hitl: requires real flight hardware
    slow: takes more than a few seconds

filterwarnings =
    default
    # MAVSDK's generated protobuf stubs emit these on import; they are not ours
    # to fix and they drown out warnings that are.
    ignore::DeprecationWarning:mavsdk.*
    # tests/test_avoider_node.py returns True from its test function. That file
    # is deliberately frozen - the P2 acceptance criterion is that it passes
    # UNMODIFIED, because it was written before the API it tests existed and is
    # the one artefact proving decide_action() was built to match a pre-existing
    # contract. Suppressed here rather than by editing the file.
    ignore::pytest.PytestReturnNotNoneWarning
